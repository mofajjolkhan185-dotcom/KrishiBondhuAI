
name: Build Krishi Bondhu AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q KrishiBondhuAI_Android_Starter.zip -d source

      - name: Fix Compose opt-in
        run: |
          sed -i 's/^fun KrishiApp()/@OptIn(ExperimentalMaterial3Api::class)\nfun KrishiApp()/' source/KrishiBondhuAI/app/src/main/java/com/krishibondhu/ai/MainActivity.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p source/KrishiBondhuAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrishiBondhuAI-APK
          path: source/KrishiBondhuAI/app/build/outputs/apk/debug/*.apk
